<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE - NEON ARCADE</title>
    <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
    <div id="gs">
        <a href="../index.html" class="backBtn">&#8592; BACK TO HUB</a>
        <div id="gs-title">SNAKE</div>
        <div id="gs-desc">Arrow keys / WASD. Eat food, grow, survive.</div>
        <div id="gc"></div>
    </div>
    <script src="../shared/core.js"></script>
    <script>
BUILDERS.snake = function() {
  var C = gc();
  var wrap = el('div','wrap');
  wrap.style.position = 'relative';

  var hud = el('div','hud');
  hud.innerHTML = 'SCORE: <span class="hv" id="snSc">0</span>&nbsp;&nbsp;&nbsp;BEST: <span class="hv" id="snHi">0</span>&nbsp;&nbsp;&nbsp;ARROWS / WASD';
  wrap.appendChild(hud);

  var cv = document.createElement('canvas');
  cv.width = 400; cv.height = 400;
  cv.style.width = '100%'; cv.style.maxWidth = '400px'; cv.style.margin = '0 auto'; cv.style.display = 'block';
  wrap.appendChild(cv);

  var ov = el('div','ov');
  ov.style.zIndex = '100';
  ov.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100';
  ov.innerHTML = '<div class="ov-title" style="color:#39ff14">SNAKE</div>';
  var ovS = el('div','ov-sub','Press START'); ov.appendChild(ovS);
  
  var diff = mkDifficulty(ov, function(d){ 
    diff = d; 
    best = getBestScore('snake');
    document.getElementById('snHi').textContent = best;
  });
  
  var startB = mkBtn('START','p'); 
  ov.appendChild(startB);
  
  wrap.appendChild(ov);
  C.appendChild(wrap);

  var ctx = cv.getContext('2d');
  var CELL=20, COLS=20, ROWS=20;
  var snake=[], food={x:0,y:0}, dir, ndir, score, best=getBestScore('snake'), running=false, loopId;
  document.getElementById('snHi').textContent=best;

  function rnd(n){ return Math.floor(Math.random()*n); }
  function spawnFood(){ food={x:rnd(COLS),y:rnd(ROWS)}; }

  function start() {
    ov.style.display = 'none';
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0}; ndir={x:1,y:0};
    score=0; running=true;
    document.getElementById('snSc').textContent=0;
    spawnFood();
    
    stopAll();
    var spd = [150, 100, 60][diff];
    addLoop(tick, spd);
  }

  function draw() {
    ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,400,400);
    // grid
    ctx.fillStyle='rgba(255,255,255,0.03)';
    for(var x=0;x<COLS;x++) for(var y=0;y<ROWS;y++) ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
    if(!snake.length) return;
    // food
    ctx.fillStyle='#ff006e'; ctx.shadowColor='#ff006e'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // snake
    snake.forEach(function(s,i){
      ctx.fillStyle = i===0?'#39ff14':'rgba(57,255,20,0.55)';
      ctx.shadowColor='#39ff14'; ctx.shadowBlur=i===0?10:4;
      ctx.fillRect(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4);
    });
    ctx.shadowBlur=0;
  }

  function tick(){
    if(!running){ draw(); return; }
    dir = ndir;
    var head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(function(s){return s.x===head.x&&s.y===head.y;})){
      running=false;
      if(saveScore('snake', score)){
        best=score; document.getElementById('snHi').textContent=best;
        ovS.textContent='NEW RECORD: '+score;
      } else {
        ovS.textContent='SCORE: '+score;
      }
      startB.textContent='PLAY AGAIN';
      ov.style.display='flex'; return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score+=10;document.getElementById('snSc').textContent=score;spawnFood();}
    else snake.pop();
    draw();
  }

  addKey(function(e){
    if(!running) return;
    var k=e.key;
    if((k==='ArrowUp'||k==='w')&&dir.y!==1) ndir={x:0,y:-1};
    else if((k==='ArrowDown'||k==='s')&&dir.y!==-1) ndir={x:0,y:1};
    else if((k==='ArrowLeft'||k==='a')&&dir.x!==1) ndir={x:-1,y:0};
    else if((k==='ArrowRight'||k==='d')&&dir.x!==-1) ndir={x:1,y:0};
  });

  startB.addEventListener('click', start);
  mkTControls(C, [
    {icon:'', cls:'none'}, {icon:'&uarr;', fn:function(){if(dir.y!==1)ndir={x:0,y:-1};}}, {icon:'', cls:'none'},
    {icon:'&larr;', fn:function(){if(dir.x!==1)ndir={x:-1,y:0};}}, {icon:'&darr;', fn:function(){if(dir.y!==-1)ndir={x:0,y:1};}}, {icon:'&rarr;', fn:function(){if(dir.x!==-1)ndir={x:1,y:0};}}
  ]);
  draw();
};
BUILDERS.snake();
    </script>
</body>
</html>
